document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

 file (white surfaces, slate-900 foreground). */\n:root {\n  --background:            var(--white);\n  --foreground:            var(--slate-900);\n\n  --card:                  var(--white);\n  --card-foreground:       var(--slate-900);\n\n  --popover:               var(--white);\n  --popover-foreground:    var(--slate-900);\n\n  --primary:               var(--slate-900);\n  --primary-foreground:    var(--slate-50);\n\n  --secondary:             var(--slate-100);\n  --secondary-foreground:  var(--slate-900);\n\n  --muted:                 var(--slate-100);\n  --muted-foreground:      var(--slate-500);\n\n  --accent:                var(--slate-100);\n  --accent-foreground:     var(--slate-900);\n\n  --destructive:           var(--red-500);\n  --destructive-foreground:var(--slate-50);\n\n  --border:                var(--slate-200);\n  --input:                 var(--slate-300);   /* control stroke (Figma input border) */\n  --ring:                  var(--slate-400);   /* focus ring */\n\n  --radius:                0.5rem;              /* 8px base; controls use 6px */\n}\n\n.dark {\n  --background:            var(--slate-950);\n  --foreground:            var(--slate-50);\n\n  --card:                  var(--slate-950);\n  --card-foreground:       var(--slate-50);\n\n  --popover:               var(--slate-950);\n  --popover-foreground:    var(--slate-50);\n\n  --primary:               var(--slate-50);\n  --primary-foreground:    var(--slate-900);\n\n  --secondary:             var(--slate-800);\n  --secondary-foreground:  var(--slate-50);\n\n  --muted:                 var(--slate-800);\n  --muted-foreground:      var(--slate-400);\n\n  --accent:                var(--slate-800);\n  --accent-foreground:     var(--slate-50);\n\n  --destructive:           var(--red-900);\n  --destructive-foreground:var(--slate-50);\n\n  --border:                var(--slate-800);\n  --input:                 var(--slate-800);\n  --ring:                  var(--slate-300);\n}\n<\u002Fstyle>\n<style> x dashed var(--slate-300); padding-top:10px; margin-bottom:10px;\">\n              <div style=\"font-size:11px; font-weight:700; margin-bottom:6px;\">① {{ years }}년 뒤 일괄 매도<\u002Fdiv>\n              <div style=\"display:flex; flex-direction:column; gap:5px; font-size:11px; color:var(--slate-600);\">\n                <div style=\"display:flex; justify-content:space-between;\"><span>비과세 (1회)<\u002Fspan><span style=\"font-family:ui-monospace,'SF Mono',monospace; font-variant-numeric:tabular-nums;\">−250만<\u002Fspan><\u002Fdiv>\n                <div style=\"display:flex; justify-content:space-between;\"><span>과세대상<\u002Fspan><span style=\"font-family:ui-monospace,'SF Mono',monospace; font-variant-numeric:tabular-nums;\">{{ usTaxable1Str }}<\u002Fspan><\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex; justify-content:space-between; align-items:baseline; margin-top:7px;\"><span style=\"font-size:11px; color:var(--slate-500);\">세금<\u002Fspan><span style=\"font-size:14px; font-weight:700; color:var(--red-600); font-family:ui-monospace,'SF Mono',monospace; font-variant-numeric:tabular-nums;\">−{{ usTax1Str }}<\u002Fspan><\u002Fdiv>\n              <div style=\"font-size:11px; color:var(--slate-500); margin-top:6px;\">세후 수령액<\u002Fdiv>\n              <div style=\"font-size:20px; font-weight:800; letter-spacing:-0.02em; white-space:nowrap; margin-top:2px;\">{{ usNet1Str }}<\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"border-top:1px dashed var(--slate-300); padding-top:10px; margin-bottom:10px;\">\n              <div style=\"font-size:11px; font-weight:700; margin-bottom:6px; color:#15803d;\">② 매년 250만씩 실현<\u002Fdiv>\n              <div style=\"display:flex; flex-direction:column; gap:5px; font-size:11px; color:var(--slate-600);\">\n                <div style=\"display:flex; justify-content:space-between;\"><span>비과세 250×{{ years }}<\u002Fspan><span style=\"font-family:ui-monospace,'SF Mono',monospace; font-variant-numeric:tabular-nums;\">−{{ usExempt2Str }}<\u002Fspan><\u002Fdiv>\n                <div style=\"display:flex; justify-content:space-between;\"><span>과세대상<\u002Fspan><span style=\"font-family:ui-monospace,'SF Mono',monospace; font-variant-numeric:tabular-nums;\">{{ usTaxable2Str }}<\u002Fspan><\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex; justify-content:space-between; align-items:baseline; margin-top:7px;\"><span style=\"font-size:11px; color:var(--slate-500);\">세금<\u002Fspan><span style=\"font-size:14px; font-weight:700; color:var(--red-600); font-family:ui-monospace,'SF Mono',monospace; font-variant-numeric:tabular-nums;\">−{{ usTax2Str }}<\u002Fspan><\u002Fdiv>\n              <div style=\"font-size:11px; color:var(--slate-500); margin-top:6px;\">세후 수령액<\u002Fdiv>\n              <div style=\"font-size:20px; font-weight:800; letter-spacing:-0.02em; white-space:nowrap; margin-top:2px;\">{{ usNet2Str }}<\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"border-top:2px solid var(--slate-900); margin:0 0 8px;\"><\u002Fdiv>\n            <div style=\"margin-top:6px; padding:7px 9px; border:1px solid var(--border); border-radius:7px;\">\n              <div style=\"font-size:10px; color:var(--slate-400); margin-bottom:2px;\">살 수 있는 예<\u002Fdiv>\n              <div style=\"font-size:11px; color:#2563eb; font-weight:600; line-height:1.45;\">VOO · SPY (S&amp;P500) · QQQ (나스닥100) 직접 매수<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"font-size:11px; color:var(--slate-500); margin-top:8px; line-height:1.5;\">매년 비과세 250만 한도로 나눠 팔면 세금이 크게 줄어듭니다 · 종합과세 없음<\u002Fdiv>\n          <\u002Fdiv>\n\n        <\u002Fdiv>\n        <div style=\"display:flex; align-items:center; gap:10px; margin-top:14px; background:#f0fdf4; border:1px solid #bbf7d0; border-radius:8px; padding:11px 14px;\">\n          <span style=\"width:7px; height:7px; border-radius:50%; background:#16a34a; flex:none;\"><\u002Fspan>\n          <div style=\"font-size:13px; color:#15803d;\">세후 가장 많이 받는 계좌: <span style=\"font-weight:700;\">{{ bestLabel }} · {{ bestNetStr }}<\u002Fspan> <span style=\"color:var(--slate-500); font-weight:500;\">· {{ sellNote }}<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size:11px; color:var(--slate-400); margin-top:12px; line-height:1.5;\">ISA는 의무가입 기간 3년 이상 유지해야 위 분리과세·비과세 혜택이 적용됩니다(중도해지 시 일반 세율). · 국내계좌 종합과세는 2천만원 이하분 15.4% + 초과분 종합합산(연봉 과세표준 기준)을 합산한 추정치입니다.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- 목표 진행 -->\n      <div style=\"order:3; background:var(--white); border:1px solid var(--border); border-radius:12px; padding:18px 20px;\">\n        <div style=\"display:flex; justify-content:space-between; align-items:baseline; margin-bottom:12px;\">\n          <div style=\"font-size:14px; font-weight:600; white-space:nowrap;\">목표 <span style=\"color:var(--slate-500); font-weight:500;\">{{ targetStr }}<\u002Fspan> 까지<\u002Fdiv>\n          <div style=\"font-size:13px; font-weight:600; color:{{ goalColor }};\">{{ goalMsg }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"height:12px; background:var(--slate-100); border-radius:999px; overflow:hidden;\"><div style=\"width:{{ progressPct }}%; height:100%; background:{{ goalColor }}; border-radius:999px;\"><\u002Fdiv><\u002Fdiv>\n        <div style=\"display:flex; justify-content:space-between; margin-top:8px; font-size:12px; color:var(--slate-500);\"><span>현재 달성 {{ progressPct }}%<\u002Fspan><span>{{ years }}년 평가액 {{ fvStr }}<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- 성장 차트 -->\n      <div style=\"order:2; background:var(--white); border:1px solid var(--border); border-radius:12px; padding:20px;\">\n        <div style=\"display:flex; justify-content:space-between; align-items:baseline; margin-bottom:2px;\">\n          <div style=\"font-size:14px; font-weight:600;\">자산 성장 추이<\u002Fdiv>\n          <div style=\"display:flex; gap:14px; font-size:11px; color:var(--slate-500);\">\n            <span style=\"display:flex; align-items:center; gap:5px;\"><span style=\"width:10px; height:10px; border-radius:2px; background:var(--slate-700);\"><\u002Fspan>납입 원금<\u002Fspan>\n            <span style=\"display:flex; align-items:center; gap:5px;\"><span style=\"width:10px; height:10px; border-radius:2px; background:#86efac;\"><\u002Fspan>투자 수익<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size:12px; color:var(--slate-500); margin-bottom:18px;\">복리가 붙을수록 수익(연두) 막대가 빠르게 커집니다<\u002Fdiv>\n        <div class=\"chartrow\" style=\"display:flex; align-items:flex-end; gap:14px; height:200px; padding:0 4px; border-bottom:1px solid var(--border);\">\n          <sc-for list=\"{{ bars }}\" as=\"b\" hint-placeholder-count=\"8\">\n            <div style=\"flex:1; min-width:0; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; height:100%;\">\n              <div class=\"cashlabel\" style=\"font-size:10px; color:var(--slate-500); margin-bottom:3px; white-space:nowrap;\">{{ b.valStr }}<\u002Fdiv>\n              <div style=\"width:64%; background:#86efac; height:{{ b.prH }}px; border-radius:4px 4px 0 0;\"><\u002Fdiv>\n              <div style=\"width:64%; background:var(--slate-700); height:{{ b.pH }}px;\"><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div class=\"chartlabels\" style=\"display:flex; gap:14px; padding:8px 4px 0;\">\n          <sc-for list=\"{{ bars }}\" as=\"b\" hint-placeholder-count=\"8\">\n            <div class=\"clbl\" style=\"flex:1; min-width:0; text-align:center; font-size:12px; font-weight:600;\">{{ b.label }}<\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n  <\u002Fsc-if>\n  <footer style=\"margin-top:32px; padding-top:20px; border-top:1px solid #e2e8f0; text-align:center; font-size:12px; color:#94a3b8; line-height:1.9;\"><a href=\"about.html\" style=\"color:#64748b;text-decoration:none;\">회사소개<\u002Fa> · <a href=\"privacy.html\" style=\"color:#64748b;text-decoration:none;\">개인정보처리방침<\u002Fa> · <a href=\"terms.html\" style=\"color:#64748b;text-decoration:none;\">이용약관<\u002Fa> · <a href=\"contact.html\" style=\"color:#64748b;text-decoration:none;\">문의<\u002Fa><\u002Ffooter>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { monthly:0, years:0, rate:0, initial:0, target:0, isaType:'일반형', otherIncome:0, shown:false };\n\n  fmtMan(m){ m=Math.round(m); if(m<0)m=0; const e=Math.floor(m/10000); const r=m-e*10000; if(e>0&&r>0) return e+'억 '+r.toLocaleString()+'만'; if(e>0) return e+'억'; return r.toLocaleString()+'만'; }\n  fv(P0,pmt,rMonthly,n){ const p=Math.pow(1+rMonthly,n); return P0*p + (rMonthly===0? pmt*n : pmt*(p-1)/rMonthly); }\n  incomeTax(base){ const b=[[1400,0.06],[5000,0.15],[8800,0.24],[15000,0.35],[30000,0.38],[50000,0.40],[100000,0.42],[Infinity,0.45]]; let t=0,prev=0; for(const x of b){ const cap=x[0],rate=x[1]; if(base<=cap){ t+=(base-prev)*rate; return Math.max(0,t);} t+=(cap-prev)*rate; prev=cap; } return t; }\n  divTax(D,B){ if(D<=0)return 0; if(D<=2000) return D*0.154; const G=D-2000; const compDiv=(this.incomeTax(B+G)-this.incomeTax(B))+2000*0.14; const sepDiv=D*0.14; return Math.max(compDiv,sepDiv)*1.1; }\n  salaryDeduction(g){ if(g<=500)return g*0.7; if(g<=1500)return 350+(g-500)*0.4; if(g<=4500)return 750+(g-1500)*0.15; if(g<=10000)return 1200+(g-4500)*0.05; return 1475+(g-10000)*0.02; }\n  estTaxBase(g){ if(g<=0)return 0; const inc=g-this.salaryDeduction(g); return Math.max(0, inc-700); }  // 연봉 → 과세표준 추정(근로소득공제·기본공제 약식)\n\n  renderVals(){\n    const s=this.state;\n    const num=(v,d)=>{ const n=Number(v); return isNaN(n)?d:n; };\n    const set=(patch)=>this.setState(patch);\n    const monthly=Math.max(0,s.monthly), years=Math.max(0,s.years), rate=Math.max(0,s.rate), initial=Math.max(0,s.initial), target=Math.max(0,s.target);\n    const r=rate/100/12, n=years*12;\n\n    const fvVal=this.fv(initial,monthly,r,n);\n    const principal=initial+monthly*n;\n    const profit=Math.max(0,fvVal-principal);\n    const profitPct=fvVal>0?Math.round(profit/fvVal*100):0;\n\n    // 목표 도달 시점\n    let goalMonth=-1;\n    for(let m=0;m<=1200;m++){ if(this.fv(initial,monthly,r,m)>=target){ goalMonth=m; break; } }\n    const reached=goalMonth>=0;\n    const gy=reached?Math.floor(goalMonth/12):0, gm=reached?goalMonth%12:0;\n    let goalState, goalMsg;\n    if(target<=initial){ goalState='now'; goalMsg='이미 목표 달성'; }\n    else if(!reached){ goalState='never'; goalMsg='현재 조건으론 도달 어려움'; }\n    else if(goalMonth<=n){ goalState='ok'; goalMsg=gy+'년 '+(gm>0?gm+'개월 ':'')+'후 목표 도달'; }\n    else { goalState='late'; goalMsg='목표까지 '+gy+'년 '+(gm>0?gm+'개월':'')+' 필요 (설정 기간 초과)'; }\n    const goalColor = goalState==='ok'||goalState==='now' ? '#16a34a' : goalState==='late' ? '#d97706' : 'var(--red-600)';\n    const progressPct = target>0 ? Math.min(100, Math.round(fvVal/target*100)) : 100;\n\n    // 차트/표 샘플 연차\n    const step=Math.max(1,Math.ceil(years/8));\n    const ys=[]; for(let y=step;y<years;y+=step) ys.push(y); if(ys[ys.length-1]!==years) ys.push(years);\n    const maxV=Math.max(fvVal,1);\n    const series=ys.map(y=>{ const m=y*12; const v=this.fv(initial,monthly,r,m); const paid=initial+monthly*m; const prof=Math.max(0,v-paid); return {y,v,paid,prof}; });\n    const H=184;\n    const bars=series.map(d=>({ label:d.y+'년', valStr:this.fmtMan(d.v), pH:Math.round(d.paid/maxV*H), prH:Math.round(d.prof/maxV*H) }));\n    const rows=series.map(d=>({ label:d.y+'년차', paidStr:this.fmtMan(d.paid), profitStr:this.fmtMan(d.prof), valStr:this.fmtMan(d.v) }));\n\n    // ===== ISA vs 일반계좌 세금 (매도 시) — 국내상장 해외ETF = 배당소득 =====\n    const D=profit;\n    const exempt = s.isaType==='서민형' ? 400 : 200;\n    const salary = Math.max(0, s.otherIncome);\n    const B = this.estTaxBase(salary);\n    const isaLimit = Math.min(2000*years, 10000);   // ISA 납입한도: 연 2천만 · 총 1억\n    const isaPrincipal = Math.min(principal, isaLimit);\n    const isaProfit = principal>0 ? profit*(isaPrincipal/principal) : profit;  // 한도내 원금이 낸 수익만 ISA 혜택\n    const excessProfit = Math.max(0, profit - isaProfit);                       // 한도초과분 → 일반(배당) 과세\n    const isaTax = Math.max(0, isaProfit-exempt)*0.099;      // ISA 한도(1억) 안 금액의 수익만 과세\n    const isaNet = isaPrincipal + isaProfit - isaTax;        // 한도 초과 납입분은 ISA에서 제외(미투자)\n    const isaOver = excessProfit > 0.5;\n    const genTax = this.divTax(D, B);               // 15.4% (2천만↓) / 종합과세 (2천만↑)\n    const genNet = fvVal - genTax;\n    const taxSaving = Math.max(0, genTax - isaTax);\n    const compre = D>2000;\n    // 미국 주식계좌: 양도소득세 22%, 250만 비과세, 종합과세 제외(분리)\n    const usTax1 = Math.max(0, D-250)*0.22;            // ① N년 뒤 일괄 매도: 250만 1회 공제\n    const usNet1 = fvVal - usTax1;\n    const usExempt2 = 250*years;                        // ② 매년 250만 실현: 연 250만 × 보유연수\n    const usTax2 = Math.max(0, D-usExempt2)*0.22;\n    const usNet2 = fvVal - usTax2;\n    const domNet = fvVal;   // 국내 개별주식·국내주식형 ETF: 매매차익 비과세\n    const accs=[['ISA','ISA계좌',isaNet],['국내','국내상장 해외ETF',genNet],['국내주식','국내주식계좌',domNet],['미국','미국 주식계좌',usNet2]];\n    accs.sort((a,b)=>b[2]-a[2]);\n    const bestKey=accs[0][0], bestLabel=accs[0][1], bestNet=accs[0][2];\n    const HI='1.5px solid var(--slate-900)', LO='1px solid var(--border)';\n\n    return {\n      shown:s.shown, onCalc:()=>this.setState({shown:true}),\n      monthly, years, rate, initial, target,\n      monthlyStr:this.fmtMan(monthly), initialStr:this.fmtMan(initial), targetStr:this.fmtMan(target),\n      fvStr:this.fmtMan(fvVal), principalStr:this.fmtMan(principal), profitStr:this.fmtMan(profit), profitPct,\n      goalMsg, goalColor, progressPct,\n      bars, rows,\n      isaType:s.isaType, otherIncome:salary, taxBaseStr:this.fmtMan(B),\n      ilbanBg: s.isaType==='일반형'?'var(--slate-900)':'var(--white)', ilbanColor: s.isaType==='일반형'?'#fff':'var(--slate-600)',\n      sominBg: s.isaType==='서민형'?'var(--slate-900)':'var(--white)', sominColor: s.isaType==='서민형'?'#fff':'var(--slate-600)',\n      setIlban:()=>set({isaType:'일반형'}), setSomin:()=>set({isaType:'서민형'}),\n      onOther:(e)=>set({otherIncome:num(e.target.value,0)}),\n      isaExemptStr:this.fmtMan(exempt), isaTaxStr:this.fmtMan(isaTax), isaNetStr:this.fmtMan(isaNet),\n      genTaxStr:this.fmtMan(genTax), genNetStr:this.fmtMan(genNet),\n      usTax1Str:this.fmtMan(usTax1), usNet1Str:this.fmtMan(usNet1), usTaxable1Str:this.fmtMan(Math.max(0,D-250)),\n      usExempt2Str:this.fmtMan(usExempt2), usTax2Str:this.fmtMan(usTax2), usNet2Str:this.fmtMan(usNet2), usTaxable2Str:this.fmtMan(Math.max(0,D-usExempt2)),\n      isaTaxableStr:this.fmtMan(Math.max(0,isaProfit-exempt)), isaOver, isaProfitStr:this.fmtMan(isaProfit), excessPrincipalStr:this.fmtMan(Math.max(0,principal-isaPrincipal)), isaLimitStr:this.fmtMan(isaLimit),\n      usTaxableStr:this.fmtMan(Math.max(0,D-250)),\n      genCompre: compre, genSeparate: !compre,\n      genBaseStr:this.fmtMan(Math.min(D,2000)*0.154),\n      genExcessAmtStr:this.fmtMan(Math.max(0,D-2000)),\n      genExcessTaxStr:this.fmtMan(Math.max(0, genTax - Math.min(D,2000)*0.154)),\n      isaBorder: bestKey==='ISA'?HI:LO, isaBg: bestKey==='ISA'?'var(--slate-50)':'var(--white)',\n      genBorder: bestKey==='국내'?HI:LO, genBg: bestKey==='국내'?'var(--slate-50)':'var(--white)',\n      usBorder: bestKey==='미국'?HI:LO, usBg: bestKey==='미국'?'var(--slate-50)':'var(--white)',\n      domBorder: bestKey==='국내주식'?HI:LO, domBg: bestKey==='국내주식'?'var(--slate-50)':'var(--white)', domNetStr:this.fmtMan(domNet),\n      bestLabel, bestNetStr:this.fmtMan(bestNet),\n      genModeLabel: compre?'종합과세':'분리과세 15.4%',\n      genSubStr: compre?'배당 2천만 초과 → 다른 소득과 합산 과세':'배당소득 15.4% 원천징수',\n      taxSavingStr:this.fmtMan(taxSaving),\n      sellNote: bestKey==='국내주식'?'국내주식·국내주식형 ETF 매매차익 비과세':(compre?('종합과세 가정: 연봉 '+this.fmtMan(salary)+' → 과세표준 약 '+this.fmtMan(B)):'배당 2천만원 이하 → 분리과세'),\n      refRates:[['S&P 500',13],['SCHD',11],['QQQ',18]].map(([label,val])=>({ label, val, apply:()=>set({rate:val}), bg: Math.abs(rate-val)<0.05?'var(--slate-100)':'var(--white)', color: Math.abs(rate-val)<0.05?'var(--slate-900)':'var(--slate-600)' })),\n      onMonthly:(e)=>set({monthly:num(e.target.value,monthly)}),\n      onYears:(e)=>set({years:num(e.target.value,years)}),\n      onRate:(e)=>set({rate:num(e.target.value,rate)}),\n      onInitial:(e)=>set({initial:num(e.target.value,0)}),\n      onTarget:(e)=>set({target:num(e.target.value,0)})\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
