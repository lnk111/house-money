<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Bundled Page</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #faf9f5; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    #__bundler_loading { position: fixed; bottom: 20px; right: 20px; font: 13px/1.4 -apple-system, BlinkMacSystemFont, sans-serif; color: #666; background: #fff; padding: 8px 14px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.12); z-index: 10000; }
    #__bundler_thumbnail { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #faf9f5; z-index: 9999; opacity: 1; transition: opacity 0.45s ease; }
    #__bundler_thumbnail.__bundler_fade { opacity: 0; pointer-events: none; }
    #__bundler_spinner { width: 38px; height: 38px; border: 3px solid rgba(30,58,95,0.18); border-top-color: #1e3a5f; border-radius: 50%; animation: __bundler_spin 0.7s linear infinite; }
    @keyframes __bundler_spin { to { transform: rotate(360deg); } }
    #__bundler_placeholder { color: #999; font-size: 14px; }
  </style>
  <noscript>
    <style>#__bundler_loading { display: none; }</style>
    <div style="position:fixed;bottom:12px;left:12px;font:13px/1.4 -apple-system,BlinkMacSystemFont,sans-serif;color:#999;background:rgba(255,255,255,0.9);padding:6px 12px;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,0.08);z-index:10000;">
      This page requires JavaScript to display.
    </div>
  </noscript>
</head>
<body>
  <div id="__bundler_thumbnail">
    <div id="__bundler_spinner"></div>
  </div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    const __spin = document.getElementById('__bundler_thumbnail');
    if (__spin) doc.body.insertBefore(__spin, doc.body.firstChild);
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
    const __ov = document.getElementById('__bundler_thumbnail');
    if (__ov) { requestAnimationFrame(function(){ requestAnimationFrame(function(){ __ov.classList.add('__bundler_fade'); setTimeout(function(){ if (__ov && __ov.parentNode) __ov.parentNode.removeChild(__ov); }, 550); }); }); }
  } catch (err) {
    console.error('Bundle unpack error:', err);
    var __e = document.getElementById('__bundler_thumbnail');
    if (__e) __e.innerHTML = '<div style="font:13px/1.5 -apple-system,BlinkMacSystemFont,sans-serif;color:#b00020;padding:16px;text-align:center;max-width:340px;">페이지를 불러오는 중 오류가 발생했습니다.<br>' + (err && err.message ? String(err.message) : '') + '</div>';
  }
});

  </script>

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<link rel=\"preconnect\" href=\"https://cdn.jsdelivr.net\" crossorigin>\n<link rel=\"stylesheet\" href=\"https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css\">\n<link rel=\"stylesheet\" href=\"https://cdn.jsdelivr.net/npm/@fontsource/inter@5/400.css\">\n<link rel=\"stylesheet\" href=\"https://cdn.jsdelivr.net/npm/@fontsource/inter@5/500.css\">\n<link rel=\"stylesheet\" href=\"https://cdn.jsdelivr.net/npm/@fontsource/inter@5/600.css\">\n<link rel=\"stylesheet\" href=\"https://cdn.jsdelivr.net/npm/@fontsource/inter@5/700.css\">\n<link rel=\"stylesheet\" href=\"https://cdn.jsdelivr.net/npm/@fontsource/inter@5/800.css\">\n<style>\n#__bundler_thumbnail { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #faf9f5; z-index: 9999; opacity: 1; transition: opacity 0.45s ease; }\n#__bundler_thumbnail.__bundler_fade { opacity: 0; pointer-events: none; }\n#__bundler_spinner { width: 38px; height: 38px; border: 3px solid rgba(30,58,95,0.18); border-top-color: #1e3a5f; border-radius: 50%; animation: __bundler_spin 0.7s linear infinite; }\n@keyframes __bundler_spin { to { transform: rotate(360deg); } }\n<\/style>\n<script src=\"2fd942d6-d1fa-4419-95e8-0744d316c7b6\"><\/script>\n<style>\n/* ===== 모바일 반응형 (<=600px 에서만 적용, 데스크탑 미변경) ===== */\n@media (max-width: 600px) {\n  /* 헤더: 제목 / 네비 / 라벨 세로 정렬 */\n  .m-hdr-row { height: auto !important; flex-direction: column; align-items: stretch !important; gap: 10px !important; padding: 10px 14px !important; }\n  .m-hdr-left { flex-direction: column; align-items: stretch !important; gap: 10px !important; }\n  .m-hdr-nav { width: 100%; }\n  .m-hdr-nav > * { flex: 1 1 0; text-align: center; }\n  .m-hdr-row > span { white-space: normal !important; }\n\n  /* 본문 컨테이너 좌우 여백 축소 */\n  .m-container { padding: 18px 14px 48px !important 1px solid var(--border); border-radius:12px; padding:20px;\">\n          <div style=\"font-size:14px; font-weight:600; margin-bottom:4px;\">대출 한도, 무엇에 막혔나<\/div>\n          <div style=\"font-size:12px; color:var(--slate-500); margin-bottom:18px;\">세 한도 중 <strong style=\"color:var(--red-600);\">가장 작은 값<\/strong>이 최종 대출액 → min()<\/div>\n          <sc-for list=\"{{ limits }}\" as=\"lim\" hint-placeholder-count=\"3\">\n            <div style=\"margin-bottom:14px;\">\n              <div style=\"display:flex; justify-content:space-between; gap:8px; font-size:12px; margin-bottom:5px;\"><span style=\"white-space:nowrap; color:{{ lim.labelColor }}; font-weight:{{ lim.weight }};\">{{ lim.name }}<\/span><span style=\"white-space:nowrap; font-weight:700; color:{{ lim.labelColor }};\">{{ lim.valStr }}<\/span><\/div>\n              <div style=\"height:14px; background:var(--slate-100); border-radius:7px; overflow:hidden;\"><div style=\"width:{{ lim.w }}%; height:100%; background:{{ lim.fill }}; border-radius:7px;\"><\/div><\/div>\n            <\/div>\n          <\/sc-for>\n        <\/div>\n      <\/div>\n\n      <!-- 매매가 구간별 차트 -->\n      <div style=\"background:var(--white); border:1px solid var(--border); border-radius:12px; padding:20px;\">\n        <div style=\"display:flex; justify-content:space-between; align-items:baseline; margin-bottom:2px;\">\n          <div style=\"font-size:14px; font-weight:600;\">매매가 구간별 시뮬레이션<\/div>\n          <div style=\"display:flex; gap:14px; font-size:11px; color:var(--slate-500);\">\n            <span style=\"display:flex; align-items:center; gap:5px;\"><span style=\"width:10px; height:10px; border-radius:2px; background:var(--slate-700);\"><\/span>대출<\/span>\n            <span style=\"display:flex; align-items:center; gap:5px;\"><span style=\"width:10px; height:10px; border-radius:2px; background:var(--slate-300);\"><\/span>필요 현금<\/span>\n          <\/div>\n        <\/div>\n        <div style=\"font-size:12px; color:var(--slate-500); margin-bottom:18px;\">{{ chartHint }}<\/div>\n\n        <div style=\"display:flex; align-items:flex-end; gap:24px; height:210px; padding:0 8px; position:relative; border-bottom:1px solid var(--border);\">\n          <div style=\"position:absolute; left:0; right:0; bottom:{{ plateauPx }}px; border-top:2px dashed var(--red-600); pointer-events:none;\"><\/div>\n          <div style=\"position:absolute; right:0; bottom:{{ plateauLabelPx }}px; font-size:10px; color:var(--red-600); font-weight:600; background:var(--white); padding:0 4px;\">{{ plateauStr }}<\/div>\n          <sc-for list=\"{{ tiers }}\" as=\"tier\" hint-placeholder-count=\"5\">\n            <div style=\"flex:1; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; height:100%;\">\n              <div style=\"font-size:11px; color:var(--slate-600); font-weight:600; margin-bottom:4px; white-space:nowrap;\">현금 {{ tier.cashStr }}<\/div>\n              <div style=\"width:66%; background:var(--slate-300); height:{{ tier.cashH }}px; border-radius:4px 4px 0 0; min-height:3px;\"><\/div>\n              <div style=\"width:66%; background:var(--slate-700); height:{{ tier.loanH }}px; display:flex; align-items:center; justify-content:center; min-height:3px;\"><span style=\"font-size:11px; font-weight:600; color:#fff; white-space:nowrap;\">{{ tier.loanStr }}<\/span><\/div>\n            <\/div>\n          <\/sc-for>\n        <\/div>\n        <div style=\"display:flex; gap:24px; padding:8px 8px 0;\">\n          <sc-for list=\"{{ tiers }}\" as=\"tier\" hint-placeholder-count=\"5\">\n            <div style=\"flex:1; text-align:center; font-size:12px; font-weight:600;\">{{ tier.label }}<\/div>\n          <\/sc-for>\n        <\/div>\n      <\/div>\n\n      <!-- 상품 비교 -->\n      <div style=\"background:var(--white); border:1px solid var(--border); border-radius:12px; padding:20px;\">\n        <div style=\"display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px;\">\n          <div style=\"font-size:14px; font-weight:600;\">대출 상품 비교<\/div>\n          <span style=\"font-size:11px; color:var(--slate-500);\">자격 ✓/✗ · 한도 막대 + 금리·월납입<\/span>\n        <\/div>\n        <sc-for list=\"{{ products }}\" as=\"p\" hint-placeholder-count=\"3\">\n          <div style=\"display:grid; grid-template-columns:135px 1fr 160px; gap:14px; align-items:center; padding:11px 16px; border-top:1px solid var(--border); margin:0 -16px; background:{{ p.rowBg }};\">\n            <div style=\"font-size:13px; font-weight:{{ p.nameWeight }}; display:flex; align-items:center; gap:6px;\">{{ p.name }} <span style=\"font-size:11px; color:{{ p.markColor }};\">{{ p.mark }}<\/span>\n              <sc-if value=\"{{ p.recommended }}\" hint-placeholder-val=\"{{ true }}\"><span style=\"font-size:10px; font-weight:700; color:#fff; background:var(--slate-900); border-radius:999px; padding:2px 7px;\">추천<\/span><\/sc-if>\n            <\/div>\n            <div style=\"height:22px; background:var(--slate-100); border-radius:6px; overflow:hidden;\"><div style=\"width:{{ p.w }}%; height:100%; background:{{ p.fill }}; border-radius:6px; display:flex; align-items:center; padding-left:9px; font-size:11px; color:#fff; font-weight:600; white-space:nowrap;\">{{ p.limitStr }}<\/div><\/div>\n            <div style=\"font-size:12px; color:var(--slate-600); text-align:right;\">{{ p.rateStr }}<\/div>\n          <\/div>\n        <\/sc-for>\n        <div style=\"font-size:11px; color:var(--slate-400); margin-top:12px;\">{{ recoNote }}<\/div>\n      <\/div>\n\n    <\/div>\n  <\/div>\n<\/div>\n<\/x-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { price:58000, income:7000, existingDebt:0, region:'비규제', area:'85이하', firstTime:true, household:'신혼·0자녀', rate:4.2, years:30, lender:'은행', holdCash:20000, saved:[] };\n\n  fmtMan(m){ m=Math.round(m); if(m<0)m=0; const e=Math.floor(m/10000); const r=m-e*10000; if(e>0&&r>0) return e+'억 '+r.toLocaleString()+'만'; if(e>0) return e+'억'; return r.toLocaleString()+'만'; }\n  fmtEok(m){ return parseFloat((Math.max(0,m)/10000).toFixed(2))+'억'; }\n  pmt(P,ratePct,years){ const r=ratePct/100/12, n=years*12; if(P<=0)return 0; if(r===0)return P/n; return P*r*Math.pow(1+r,n)/(Math.pow(1+r,n)-1); }\n  dsrPrincipal(annual,stressPct,years){ const r=stressPct/100/12, n=years*12, m=annual/12; if(m<=0)return 0; if(r===0)return m*n; return m*(Math.pow(1+r,n)-1)/(r*Math.pow(1+r,n)); }\n  capByPrice(p){ return p<=150000?60000 : p<=250000?40000 : 20000; }\n  acqRate(p){ if(p<=60000)return 1.1; if(p<=90000)return 1.1+(p-60000)/30000*2.2; return 3.3; }\n  acqTax(p,first){ let t=p*this.acqRate(p)/100; if(first&&p<=120000)t=Math.max(0,t-200); return t; }\n  brokerFee(p){ const rate=p<=90000?0.4:p<=120000?0.5:0.6; return p*rate/100; }\n\n  renderVals(){\n    const s=this.state;\n    const num=(v,d)=>{ const n=Number(v); return isNaN(n)?d:n; };\n    const set=(patch)=>this.setState(patch);\n    const RED='var(--red-600)', S3='var(--slate-300)', S4='var(--slate-400)', S6='var(--slate-600)', S9='var(--slate-900)';\n    const HATCH='repeating-linear-gradient(45deg, var(--slate-200) 0 6px, var(--slate-100) 6px 12px)';\n\n    const price=s.price, income=s.income, regulated=s.region==='규제';\n    const nw=s.household.includes('신혼'), tk=s.household.includes('2자녀');\n    const ltvRate = s.firstTime ? (regulated?0.70:0.80) : (regulated?0.40:0.70);\n    const stress = regulated?3.0:1.5;\n    const dsrRate = s.lender==='은행'?0.40:0.50;\n\n    const annualCap = income*dsrRate - s.existingDebt;\n    const examRate = s.rate + stress;\n    const dsrLoan = this.dsrPrincipal(Math.max(0,annualCap), examRate, s.years);\n    const ltvLoan = price*ltvRate;\n    const capLoan = regulated ? this.capByPrice(price) : Infinity;\n    const finalLoan = Math.max(0, Math.min(ltvLoan, dsrLoan, capLoan));\n\n    let binding='LTV', bv=ltvLoan;\n    if(dsrLoan<bv){binding='DSR';bv=dsrLoan;}\n    if(regulated && capLoan<bv){binding='절대캡';bv=capLoan;}\n    const bindingLabel = binding==='LTV'?'LTV에 묶임':binding==='DSR'?'DSR에 묶임':'절대캡에 묶임';\n\n    const fee = this.acqTax(price,s.firstTime)+this.brokerFee(price);\n    const cash = Math.max(0, price - finalLoan + fee);\n    const monthly = this.pmt(finalLoan, s.rate, s.years);\n    const totalPay = monthly*s.years*12;\n    const interest = totalPay - finalLoan;\n\n    const total = finalLoan+cash;\n    const loanPct = total>0?Math.round(finalLoan/total*100):0;\n    const equityPct = 100-loanPct;\n    const baseCash = Math.max(0, cash-fee);\n\n    const maxBar = Math.max(ltvLoan, dsrLoan, regulated?capLoan:ltvLoan)*1.08;\n    const bar=(v)=>Math.max(2, Math.min(100, v/maxBar*100));\n    const limits=[\n      { name:'LTV 한도 ('+(s.firstTime?'생애최초 ':'')+Math.round(ltvRate*100)+'%)', valStr:this.fmtEok(ltvLoan)+(binding==='LTV'?' ← 묶임':''), w:bar(ltvLoan), fill:binding==='LTV'?RED:S3, labelColor:binding==='LTV'?RED:S6, weight:binding==='LTV'?700:500 },\n      { name:'DSR 한도 · 소득 '+income.toLocaleString()+'만', valStr:this.fmtEok(dsrLoan)+(binding==='DSR'?' ← 묶임':''), w:bar(dsrLoan), fill:binding==='DSR'?RED:S3, labelColor:binding==='DSR'?RED:S6, weight:binding==='DSR'?700:500 },\n      regulated\n        ? { name:'절대캡 (수도권·규제)', valStr:this.fmtEok(capLoan)+(binding==='절대캡'?' ← 묶임':''), w:bar(capLoan), fill:binding==='절대캡'?RED:S3, labelColor:binding==='절대캡'?RED:S6, weight:binding==='절대캡'?700:500 }\n        : { name:'절대캡 (비규제 미적용)', valStr:'— 6억', w:100, fill:HATCH, labelColor:S4, weight:500 }\n    ];\n\n    const prices=[50000,60000,70000,80000,90000];\n    const rows=prices.map(p=>{ const lv=p*ltvRate; const cp=regulated?this.capByPrice(p):Infinity; const loanP=Math.max(0,Math.min(lv,dsrLoan,cp)); const feeP=this.acqTax(p,s.firstTime)+this.brokerFee(p); const need=Math.max(0,p-loanP+feeP); return {p,loanP,need,total:loanP+need}; });\n    const maxTotal=Math.max(...rows.map(r=>r.total))*1.05;\n    const k=170/maxTotal;\n    const tiers=rows.map(r=>({ label:parseFloat((r.p/10000).toFixed(1))+'억', loanH:Math.round(r.loanP*k), cashH:Math.round(r.need*k), cashStr:this.fmtEok(r.need), loanStr:this.fmtEok(r.loanP) }));\n    const plateauVal=Math.min(dsrLoan, regulated?this.capByPrice(90000):Infinity);\n    const plateauPx=Math.round(plateauVal*k);\n    const capBindsHigh = regulated && this.capByPrice(90000)<dsrLoan;\n    const plateauStr=(capBindsHigh?'절대캡 ':'DSR 한도 ')+this.fmtEok(plateauVal);\n\n    // 정책대출\n    const ddIncomeLimit = s.firstTime?7000:(nw?8500:6000);\n    const ddPriceLimit = (nw||tk)?60000:50000;\n    const ddElig = s.area==='85이하' && income<=ddIncomeLimit && price<=ddPriceLimit;\n    const ddCap = nw?32000:(s.firstTime?24000:20000);\n    const ddLimit = Math.min(price*(s.firstTime?0.8:0.7), ddCap);\n    const ddMonthly = this.pmt(ddLimit, 2.8, s.years);\n    const bgIncomeLimit = nw?8500:7000;\n    const bgElig = income<=bgIncomeLimit && price<=60000;\n    const bgCap = s.firstTime?42000:36000;\n    const bgLimit = Math.min(price*(s.firstTime?0.8:0.7), bgCap);\n    const bgMonthly = this.pmt(bgLimit, 3.6, s.years);\n\n    // 신생아 특례 (2026.06 정책): 부부합산 ≤2억 · 주택 ≤9억 · 한도 5억 · 특례금리 1.8~4.5% 고정 · 최근 2년내 출산 가구\n    const hasNewborn = s.household.includes('자녀');\n    const nbElig = hasNewborn && s.area==='85이하' && income<=20000 && price<=90000;\n    const nbCap = 50000;\n    const nbLimit = Math.min(price*(s.firstTime?(regulated?0.70:0.80):0.70), nbCap);\n    let nbRate = income<=8500?1.8 : income<=13000?2.8 : 3.7;   // 소득 구간별 특례금리\n    nbRate += s.years>=30?0.4 : s.years>=20?0.2 : s.years>=15?0.1 : 0;  // 만기 가산\n    if(tk) nbRate -= 0.2;  // 2자녀↑ 추가출산 우대\n    nbRate = Math.round(Math.max(1.0, Math.min(4.5, nbRate))*100)/100;\n    const nbMonthly = this.pmt(nbLimit, nbRate, s.years);\n\n    // 추천: 자격 충족 정책대출 중 한도 큰 것 → 없으면 일반\n    let recoKey='일반';\n    const cands=[];\n    if(nbElig) cands.push({key:'신생아 특례', limit:nbLimit, rate:nbRate});\n    if(ddElig) cands.push({key:'디딤돌', limit:ddLimit, rate:2.8});\n    if(bgElig) cands.push({key:'보금자리론', limit:bgLimit, rate:3.6});\n    if(cands.length){ cands.sort((a,b)=> b.limit-a.limit || a.rate-b.rate); recoKey=cands[0].key; }\n\n    const maxLimitRef=Math.max(finalLoan, nbElig?nbLimit:0, ddElig?ddLimit:0, bgElig?bgLimit:0, 1)*1.0;\n    const pw=(v)=>Math.max(0, Math.min(100, v/maxLimitRef*100));\n    const prod=(name,elig,limit,rate,monthly,failMsg)=>{\n      const rec = recoKey===name;\n      return { name, mark:elig?'✓':'✗', markColor:elig?S4:RED, recommended:rec,\n        w: elig?pw(limit):0, fill: rec?S9:(elig?S4:S3),\n        limitStr: elig?('한도 '+this.fmtEok(limit)):'',\n        rateStr: elig?('금리 '+rate+'% · 월 '+Math.round(monthly)+'만'):(failMsg||'주택가/소득 기준 초과'),\n        rowBg: rec?'var(--slate-50)':'transparent', nameWeight: rec?700:600 };\n    };\n    const products=[\n      prod('일반 주담대', true, finalLoan, s.rate, monthly),\n      prod('신생아 특례', nbElig, nbLimit, nbRate, nbMonthly, '최근 2년 내 출산 가구 한정'),\n      prod('디딤돌', ddElig, ddLimit, 2.8, ddMonthly),\n      prod('보금자리론', bgElig, bgLimit, 3.6, bgMonthly)\n    ];\n    const recoNote = recoKey==='일반'\n      ? '정책대출 자격 미달 — 일반 주담대 기준. 소득·주택가 요건을 낮추면 디딤돌·보금자리론 비교 가능.'\n      : '추천: '+recoKey+' — 자격 충족 상품 중 한도·금리가 가장 유리';\n\n    const chartHint = capBindsHigh\n      ? '6억 절대캡에 막혀 대출이 멈추고, 집값이 오를수록 현금만 늘어난다'\n      : '소득이 묶여 대출은 '+this.fmtEok(plateauVal)+'에서 멈추고, 집값이 오를수록 현금만 늘어난다';\n\n    // ===== 유저플로우 통합: 자동판정 칩 · 충족/부족 분기 · 시나리오 =====\n    const chip=(t,kind)=> kind==='emph' ? {t,bg:S9,color:'#fff',border:S9}\n      : kind==='amber' ? {t,bg:'#fffbeb',color:'#92400e',border:'#fcd34d'}\n      : {t,bg:'var(--slate-100)',color:S6,border:'var(--border)'};\n    const verdicts=[\n      chip(regulated?'규제지역':'비규제'),\n      chip(s.firstTime?'생애최초':'일반 무주택'),\n      chip('LTV '+Math.round(ltvRate*100)+'%', binding==='LTV'?'emph':null),\n      chip('DSR '+Math.round(dsrRate*100)+'%', binding==='DSR'?'emph':null),\n      chip('스트레스 +'+stress+'%p','amber')\n    ];\n\n    const holdCash=s.holdCash;\n    const shortfall=cash-holdCash;\n    const extra=Math.max(0, shortfall);\n    const sufficient=shortfall<=0;\n    let affordPrice=0, affordNeed=0;\n    for(let p=10000;p<=300000;p+=500){ const lv=p*ltvRate; const cp=regulated?this.capByPrice(p):Infinity; const loanP=Math.max(0,Math.min(lv,dsrLoan,cp)); const feeP=this.acqTax(p,s.firstTime)+this.brokerFee(p); const need=Math.max(0,p-loanP+feeP); if(need<=holdCash){affordPrice=p;affordNeed=need;} else break; }\n    const canAfford=affordPrice>0;\n    const affordPct=price>0?Math.max(0,Math.min(100,Math.round(affordPrice/price*100))):0;\n    const statusTitle = sufficient ? '보유 현금으로 충당 가능' : '현금 '+this.fmtMan(shortfall)+' 부족';\n    const statusSub = sufficient ? '필요 현금 '+this.fmtEok(cash)+' ≤ 보유 '+this.fmtEok(holdCash) : '필요 현금 '+this.fmtEok(cash)+' > 보유 '+this.fmtEok(holdCash);\n    const statusRight = sufficient ? '여유 '+this.fmtEok(-shortfall) : '추천가 '+this.fmtMan(affordPrice);\n\n    return {\n      verdicts,\n      holdCash, onHold:(e)=>set({holdCash:num(e.target.value,0)}),\n      sufficient, insufficient:!sufficient,\n      statusBg: sufficient?'#f0fdf4':'#fef2f2', statusBorder: sufficient?'#bbf7d0':'#fecaca',\n      statusColor: sufficient?'#15803d':'#b91c1c', statusIconBg: sufficient?'#16a34a':'#dc2626',\n      statusIcon: sufficient?'✓':'!', statusTitle, statusSub, statusRight,\n      affordStr:this.fmtMan(affordPrice), affordEokStr:this.fmtEok(affordPrice), affordNeedStr:this.fmtEok(affordNeed),\n      affordPct, priceEokStr:this.fmtEok(price), holdStr:this.fmtMan(holdCash),\n      canAfford, noAfford:!canAfford,\n      feeStr:this.fmtMan(fee),\n      extraStr: extra>0?this.fmtMan(extra):'0원',\n      extraCaption: extra>0?('보유 현금 '+this.fmtMan(holdCash)+' 제외'):'보유 현금으로 충당 ✓',\n      saved:s.saved, hasSaved:s.saved.length>0,\n      saveScenario:()=>this.setState(st=>({saved:[...st.saved.slice(-3), {label:this.fmtEok(price), cash:this.fmtEok(cash)}]})),\n      setToAfford:()=>set({price:affordPrice}),\n      price, priceStr:this.fmtMan(price), income, existingDebt:s.existingDebt, rate:s.rate, years:s.years,\n      region:s.region, area:s.area, household:s.household, lender:s.lender, yearsStr:String(s.years),\n      firstBg: s.firstTime?S9:'var(--white)', firstColor: s.firstTime?'#fff':S6,\n      firstKnobTrack: s.firstTime?'#fff':S3, firstKnobColor: s.firstTime?S9:'#fff', firstKnobLeft: s.firstTime?'15px':'2px',\n      onPrice:(e)=>set({price:num(e.target.value,price)}),\n      onIncome:(e)=>set({income:num(e.target.value,0)}),\n      onDebt:(e)=>set({existingDebt:num(e.target.value,0)}),\n      onRate:(e)=>set({rate:num(e.target.value,0)}),\n      onYears:(e)=>set({years:num(e.target.value,30)}),\n      onRegion:(e)=>set({region:e.target.value}),\n      onArea:(e)=>set({area:e.target.value}),\n      onHousehold:(e)=>set({household:e.target.value}),\n      onLender:(e)=>set({lender:e.target.value}),\n      toggleFirst:()=>this.setState(st=>({firstTime:!st.firstTime})),\n      cashStr:this.fmtMan(cash), loanStr:this.fmtMan(finalLoan), loanEok:this.fmtEok(finalLoan), equityEok:this.fmtEok(cash),\n      bindingLabel, monthlyStr:Math.round(monthly).toLocaleString()+'만', interestStr:this.fmtEok(interest), totalStr:this.fmtEok(totalPay),\n      loanPct, equityPct, cashBreakdown:'현금 '+this.fmtEok(baseCash)+' + 부대 '+this.fmtEok(fee),\n      limits, tiers, plateauPx, plateauLabelPx:plateauPx+4, plateauStr, chartHint,\n      products, recoNote\n    };\n  }\n}\n<\/script>\n\n\n<\/body><\/html>"
  </script>
